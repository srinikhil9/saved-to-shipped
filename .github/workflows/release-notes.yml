# Release bot.
# v* tag: prepend CHANGELOG.md, commit it to main, publish the GitHub Release.
# The [skip release-notes] marker applies only to branch pushes, so tagging the
# changelog commit still publishes the Release.
# Push to main, or a manual run: write the job summary and update the draft Release named latest.
# Token: GITHUB_TOKEN only.

name: Release notes

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the notes and skip the release and changelog
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  release-notes:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message, '[skip release-notes]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node .github/release/release-notes.mjs
